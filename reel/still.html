<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ghost still</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { loadAssets, buildGhost } from './src/ghost.js';
import { buildStudio, buildPost } from './src/studio.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1920);
const state = q.get('state') || 'closed';

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 24), W / H, 50, 14000);
camera.layers.enable(1);            // layer 1 = backdrop + haze, kept out of the floor's mirror pass
renderer.setClearColor(0x000000, 0);
const assets = await loadAssets();
const ghost = buildGhost(assets);
scene.add(ghost.root);
const studio = buildStudio(renderer, scene, { floorY: assets.meta.base_bottom_y, width: W, height: H });
const post = buildPost(renderer, scene, camera, W, H);

const LOOKS = {
  // pre-drop mood: shell shut, glow kept faint
  closed: { open: 0, mood: 'neutral', eyePower: 0.6, ledLevel: 0.4, glow: 0.6, bloom: 0.4, exposure: 1.0, pan: -6, tilt: 0 },
  // post-drop hero: shell sprung open 12 mm, eye and ring at full
  open: { open: 1, mood: 'excited', eyePower: 1, ledLevel: 1, glow: 1.0, bloom: 0.42, exposure: 1.0, pan: -6, tilt: 2 },
};
const L = { ...LOOKS[state] };
for (const k of ['pan', 'tilt', 'bloom', 'glow', 'eyePower', 'ledLevel']) if (q.has(k)) L[k] = +q.get(k);
if (q.has('mood')) L.mood = q.get('mood');
ghost.setOpen(L.open); Object.assign(ghost.look, { moodA: L.mood, moodB: L.mood, mix: 0, eyePower: L.eyePower, ledLevel: L.ledLevel, glow: L.glow });
ghost.pan.rotation.y = THREE.MathUtils.degToRad(L.pan); ghost.tilt.rotation.x = THREE.MathUtils.degToRad(-L.tilt);
post.bloom.strength = L.bloom; post.grade.uniforms.uExposure.value = L.exposure;

const cam = (q.get('cam') || '285,0,1060').split(',').map(Number);
const tgt = (q.get('tgt') || '-8,-40,-30').split(',').map(Number);
camera.position.set(...cam); camera.lookAt(...tgt);
post.dof.uniforms.uFocus.value = +(q.get('focus') || camera.position.distanceTo(new THREE.Vector3(0, 0, 30)));
post.dof.uniforms.uAperture.value = +(q.get('aperture') || 0);

const t0 = performance.now();
for (let i = 0; i < 3; i++) { ghost.update(renderer, 1.3); post.render(1.3); }
renderer.getContext().finish();
window.__ms = (performance.now() - t0) / 3;
window.__ready = true;
window.__ghost = ghost; window.__studio = studio; window.__post = post;
</script>
</body>
</html>
